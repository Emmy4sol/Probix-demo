<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Probix - Predictive Financial Intelligence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="parallax-hero">
    <!-- LAYER 1: Deepest Background (Network Grid Mesh) -->
    <div class="parallax-layer layer-bg" data-speed="2">
      <div class="network-grid-mock"></div>
    </div>

    <!-- LAYER 2: Midground (Slanted Glass Logo & Branding) -->
    <div class="parallax-layer layer-mid" data-speed="5">
      <div class="logo-container">
        <!-- 27% Slanted 'P' Icon Wrapper -->
        <div class="glass-p-icon">P</div>
        <h1 class="brand-name">PROBIX</h1>
      </div>
    </div>

    <!-- LAYER 3: Foreground (Floating Premium UI Data Cards) -->
    <div class="parallax-layer layer-fg" data-speed="9">
      
      <!-- Mini Glass Widget 1 -->
      <div class="prediction-card glass-card card-left">
        <div class="card-header">Inflation &lt; 18%</div>
        <div class="card-percentage">72% <span class="yes-tag">YES</span></div>
        <div class="mini-chart upward"></div>
      </div>

      <!-- Mini Glass Widget 2 -->
      <div class="prediction-card glass-card card-right">
        <div class="card-header">Naira &lt; ₦2,000/$</div>
        <div class="card-percentage">68% <span class="yes-tag">YES</span></div>
        <div class="mini-chart upward-stable"></div>
      </div>

    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
